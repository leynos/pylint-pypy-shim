name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install CLI tools
        run: |
          for tool in mbake ty ruff; do uv tool install ${tool}; done

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Check spelling
        run: make spelling

      - name: Install code
        run: make build

      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@c5a54701c8603a0fa756a6b34c49bc2af75a6c11
        with:
          version: "0.6.0"

      - name: Check formatting
        run: make check-fmt

      - name: Lint Markdown
        # The upstream action rather than an installation of our own: its
        # release carries the linter's whole dependency graph, so nothing is
        # resolved from the registry at run time, and Dependabot manages the
        # pin alongside the other actions. It reads .markdownlint-cli2.jsonc
        # from the workspace, so the rules and ignores match `make markdownlint`.
        uses: DavidAnson/markdownlint-cli2-action@4580e1612f6407034edd6c0e4e316d725920867b  # v24.2.0
        with:
          globs: '**/*.md'

      - name: Run ruff
        run: make lint

      - name: Run typechecker
        run: make typecheck

      - name: Generate coverage
        if: github.event_name == 'pull_request'
        uses: leynos/shared-actions/.github/actions/generate-coverage@2f90d1041ea108148be0620e3bbcc1fa80ac03e4
        with:
          output-path: coverage.xml
          format: cobertura
          pytest-workers: ''
          with-ratchet: 'true'

      - name: Check coverage against CodeScene gates
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        if: env.CS_ACCESS_TOKEN != '' && github.event_name == 'pull_request'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@2f90d1041ea108148be0620e3bbcc1fa80ac03e4
        with:
          format: cobertura
          mode: check
          project-url: https://api.codescene.io/v2/projects/80100
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ vars.CODESCENE_CLI_SHA256 }}
