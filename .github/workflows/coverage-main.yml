name: Coverage (main)

# The single CodeScene publisher. CodeScene accepts `cs-coverage upload`
# only for analysed branches, so main's coverage is uploaded here on
# push. Pull requests generate coverage with the ratchet this workflow
# advances, and nothing a pull request runs receives CodeScene
# credentials or contacts CodeScene.
# tests/workflow_contracts/test_codescene_coverage_contract.py holds the
# shape.
#
# workflow_dispatch is required, not optional: merges performed by the
# dependabot-automerge workflow's GITHUB_TOKEN do not fire push-event
# workflows, so automerged changes to main only get coverage uploaded via
# a manual dispatch re-run. A dispatch can aim at any branch, which is
# why the upload step is guarded on the ref as well as the token.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One publisher run at a time, never cancelled. GitHub keeps one pending
# run per group, so a newer push replaces an older pending run and never
# interrupts a running one; the newest baseline wins. A cancelled run
# would abandon both its upload and its ratchet baseline write.
concurrency:
  group: coverage-main
  cancel-in-progress: false

jobs:
  coverage-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install code
        run: make build

      - name: Generate coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@a5765019912a8ab6882b12db049c7cde635f3a85
        with:
          output-path: coverage.xml
          format: cobertura
          pytest-workers: ''
          with-ratchet: 'true'

      - name: Upload coverage to CodeScene
        # The token binds here and nowhere else in the workflow.
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        if: env.CS_ACCESS_TOKEN != '' && github.ref == 'refs/heads/main'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@a5765019912a8ab6882b12db049c7cde635f3a85
        with:
          format: cobertura
          mode: upload
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          # No checksum input: the action pins the CLI through its own
          # manifest, and `installer-checksum` is rejected from this pin.
