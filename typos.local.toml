# Repository-specific identifiers, quotations and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
accepted = [
  "Astroid",
  "Flavored",
]

[words.corrections]

[patterns]
# The documentation style guide quotes `color` as its example of a US
# spelling an external API requires; only that inline-code literal is
# exempt, so prose still has to spell "colour".
ignore = [
  "`color`",
]

[files]
exclude = []
